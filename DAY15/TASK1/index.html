<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-dark text-light min-vh-100">
    <nav class="navbar navbar-dark bg-black border-bottom border-secondary py-3">
        <div class="container">
            <a href="#" class="navbar-brand fw-bold text-warning fs-4" id="homeBtn">
                <i class="fa-solid fa-utensils me-2"></i>
                Recipe Finder
            </a>
            <button class="btn btn-outline-warning rounded-pill" id="favoritesBtn">
                <i class="fa-solid fa-heart text-danger me-1"></i>
                Favorites
                <span class="badge bg-danger ms-1" id="favoritesCount">0</span>
            </button>
        </div>
    </nav>
    <section class="py-5 border-bottom border-secondary">
        <div class="container text-center">
            <h1 class="fw-bold mb-2">Find Your Favorite Recipes</h1>
            <p class="text-secondary mb-4">
                Search for delicious recipes and save your favorites
            </p>
            <form id="searchForm" class="mx-auto" style="max-width: 600px;">
                <div class="input-group input-group-lg">
                    <input
                        type="text"
                        id="searchInput"
                        class="form-control bg-dark text-light border-secondary"
                        placeholder="Search for a recipe..."
                        required
                    >
                    <button class="btn btn-warning px-4" type="submit">
                        <i class="fa-solid fa-magnifying-glass me-1"></i>
                        Search
                    </button>
                </div>
            </form>
            <div class="mt-3">
                <span class="badge bg-secondary d-none p-2" id="searchBadge">
                    Results for:
                    <span class="text-warning" id="badgeText"></span>
                </span>
            </div>
        </div>
    </section>
    <main class="container py-5">
        <div class="text-center d-none" id="loading">
            <div class="spinner-border text-warning" role="status"></div>
            <p class="text-secondary mt-2">Loading recipes...</p>
        </div>
        <div class="row g-4" id="recipesContainer"></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
